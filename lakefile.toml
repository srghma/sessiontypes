name = "sessiontypes"
version = "0.1.0"
defaultTargets = ["SessionTypes"]
testDriver = "SessionTypesTests"
lintDriver = "batteries/runLinter"

[leanOptions]
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
weak.linter.pythonStyle = false
weak.linter.checkInitImports = false
weak.linter.allScriptsDocumented = false
weak.linter.unicodeLinter = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "SessionTypes"
globs = ["SessionTypes.*"]

[[lean_lib]]
name = "SessionTypesTests"
globs = ["SessionTypesTests"]
moreLeanArgs = ["-Dweak.linter.style.header=false"]

[[lean_exe]]
name = "SessionTypesTestsExe"
root = "SessionTypesTests"
